openapi: 3.0.3
info:
  title: Art Course & Supplies Platform - Unified API (BE1 + BE2)
  description: |
    Tài liệu đặc tả API chuẩn OpenAPI 3.0 hợp nhất toàn diện hệ thống (Backend 1: Đào tạo, Trẻ em, Tin nhắn, Video + Backend 2: Thương mại, Thanh toán, Vận chuyển, Tài chính).
    Hệ thống bao gồm: Thương mại, Giỏ hàng, Đơn hàng, Thanh toán, Vận chuyển, Tài chính & Sổ cái, Kiểm duyệt & Quản trị.
    
    ### Cơ chế Xác thực:
    - **Header**: `Authorization: Bearer <JWT_ACCESS_TOKEN>`
    - **Thuật toán ký**: HMAC-SHA256 (HS256)
    - **Claims bắt buộc**:
      - `userId`: UUID của người dùng
      - `role`: Vai trò (`PARENT`, `TEACHER`, `STAFF`, `ADMIN`)
      - `type`: Phải là `ACCESS` (Token `REFRESH` bị từ chối)
    
    ### Chuẩn phản hồi chung (ApiResponse):
    Mọi phản hồi JSON đều bọc trong cấu trúc chuẩn:
    ```json
    {
      "success": true,
      "message": "Thông điệp thành công",
      "data": { ... },
      "error": null,
      "timestamp": "2026-10-14T12:00:00Z"
    }
    ```
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Máy chủ Localhost phát triển

tags:
  - name: Auth (BE1)
    description: Đăng ký, đăng nhập và cấp phát JWT token (BE1)
  - name: Children (BE1)
    description: Quản lý hồ sơ trẻ em của phụ huynh (BE1)
  - name: Child Progress (BE1)
    description: Theo dõi và cập nhật tiến độ học tập của trẻ (BE1)
  - name: Courses Management (BE1)
    description: Tạo, cập nhật và quản lý khóa học của giáo viên (BE1)
  - name: Customize Requests (BE1)
    description: Quản lý yêu cầu mở lớp / khóa học vẽ theo yêu cầu (BE1)
  - name: Offers (BE1)
    description: Báo giá và đề xuất của giáo viên cho yêu cầu customize (BE1)
  - name: Enrollments (BE1)
    description: Ghi danh khóa học và quản lý quyền học (BE1)
  - name: Lessons (BE1)
    description: Quản lý giáo trình và bài học chi tiết (BE1)
  - name: Lesson Supplies (BE1)
    description: Liên kết dụng cụ cần thiết cho từng bài học (BE1)
  - name: Conversations & Messages (BE1)
    description: Trò chuyện và trao đổi tin nhắn giữa phụ huynh và giáo viên (BE1)
  - name: Submissions & Grading (BE1)
    description: Nộp bài vẽ thực hành và giáo viên chấm điểm nhận xét (BE1)
  - name: Supplies Management (BE1)
    description: Quản lý đăng tải và cập nhật dụng cụ vẽ (BE1)
  - name: Course Reviews Management (BE1)
    description: Quản lý và tra cứu đánh giá khóa học (BE1)
  - name: Refunds Management (BE1)
    description: Tra cứu và quản lý hoàn tiền (BE1)
  - name: Moderation Reviews (BE1)
    description: Lịch sử và tra cứu nhật ký kiểm duyệt (BE1)
  - name: Video & HLS Streaming (BE1)
    description: Upload video bài học và phát luồng HLS trực tuyến (BE1)
  - name: Shop & Courses
    description: Duyệt danh mục khóa học, xem chi tiết (an toàn không lộ video thô), xem thử bài học và đánh giá (SHOP-01, SHOP-09, SHOP-10)
  - name: Supplies
    description: Xem danh mục dụng cụ vẽ và kiểm tra tồn kho khả dụng (SHOP-02)
  - name: Cart
    description: Quản lý giỏ hàng phụ huynh, kiểm tra xung đột mua trùng khóa học và kiểm tra tồn kho (SHOP-03, SHOP-04, SHOP-08)
  - name: Orders
    description: Tạo đơn hàng tách theo giáo viên, tra cứu và hủy đơn (SHOP-05, SHOP-06, BR-04)
  - name: Payments
    description: Tạo yêu cầu thanh toán (VNPay/MoMo/Mock), xử lý Webhook IPN idempotent và kiểm tra trạng thái (PAY-01, PAY-02, PAY-09, PAY-10)
  - name: Fulfillment
    description: Quản lý vòng đời vận chuyển dụng cụ giáo viên - phụ huynh - nhân viên (FUL-01 đến FUL-08)
  - name: Teacher Finance
    description: Tra cứu số dư sổ cái thời gian thực và yêu cầu rút tiền của Giáo viên (FIN-01, FIN-02, FIN-03, FIN-04)
  - name: Admin Finance & Config
    description: Duyệt/từ chối rút tiền, ghi nhận chi trả thủ công và cấu hình hệ thống (FIN-05, FIN-06, ADM-02, ADM-03)
  - name: Refunds
    description: Yêu cầu, xét duyệt và hoàn tất hoàn tiền theo dòng chi tiết (FIN-07, FIN-08, FIN-09, FIN-10)
  - name: Staff
    description: Kiểm duyệt dụng cụ vi phạm, tiếp nhận khiếu nại và tra cứu trao đổi có kiểm soát (STF-01 đến STF-06, MSG-06)
  - name: Admin Analytics
    description: Thống kê tài chính toàn diện sàn và tra cứu sổ cái kiểm toán (ADM-04, ADM-05, ADM-06)
  - name: Moderation
    description: Ghi nhận và truy vấn lịch sử nhật ký kiểm duyệt đa đối tượng (STF-07)
  - name: Notifications
    description: Hộp thư thông báo người dùng và cập nhật trạng thái đã đọc (NFR-08)

paths:

  # =========================================================================
  # BE1 - AUTHENTICATION
  # =========================================================================
  /auth/register:
    post:
      tags: [Auth (BE1)]
      summary: Đăng ký tài khoản mới (Phụ huynh / Giáo viên)
      description: Đăng ký tài khoản mới vào hệ thống và nhận JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName, role]
              properties:
                email: { type: string, example: "parent_test@gmail.com" }
                password: { type: string, example: "Password123@" }
                fullName: { type: string, example: "Nguyễn Văn A" }
                role: { type: string, enum: [PARENT, TEACHER], example: "PARENT" }
                phone: { type: string, example: "0901234567" }
      responses:
        '200':
          description: Đăng ký thành công, trả về JWT Access Token
        '400':
          description: Email đã tồn tại hoặc dữ liệu không hợp lệ

  /auth/login:
    post:
      tags: [Auth (BE1)]
      summary: Đăng nhập tài khoản
      description: Xác thực người dùng bằng email và mật khẩu, trả về JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: "parent_test@gmail.com" }
                password: { type: string, example: "Password123@" }
      responses:
        '200':
          description: Đăng nhập thành công, trả về Access Token
        '401':
          description: Sai thông tin đăng nhập

  # =========================================================================
  # BE1 - CHILDREN MANAGEMENT
  # =========================================================================
  /api/children:
    post:
      tags: [Children (BE1)]
      summary: Tạo mới hồ sơ trẻ em
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, example: "Bé Bo", description: "Tên hiển thị của trẻ (hoặc truyền name)" }
                birthYear: { type: integer, example: 2018, description: "Năm sinh (1900-2100) (hoặc truyền birthDate)" }
                username: { type: string, example: "be_bo_01", description: "Tên đăng nhập (tùy chọn, tự động sinh nếu để trống)" }
                password: { type: string, example: "Password123!", description: "Mật khẩu cho tài khoản trẻ (tùy chọn, mặc định Password123!)" }
                name: { type: string, example: "Bé Bo", description: "Alias của displayName" }
                birthDate: { type: string, format: date, example: "2018-05-20", description: "Alias của birthYear (hệ thống tự trích xuất năm)" }
                gender: { type: string, enum: [MALE, FEMALE, OTHER], example: "MALE" }
                avatarUrl: { type: string, example: "https://example.com/avatar.jpg" }
            example:
              displayName: "Bé Bo"
              birthYear: 2018
              username: "be_bo_01"
              password: "Password123!"
      responses:
        '201':
          description: Tạo hồ sơ thành công

  /api/children/{id}:
    get:
      tags: [Children (BE1)]
      summary: Xem chi tiết hồ sơ trẻ em
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Thông tin hồ sơ trẻ em
    put:
      tags: [Children (BE1)]
      summary: Cập nhật hồ sơ trẻ em
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                birthDate: { type: string, format: date }
                gender: { type: string }
                avatarUrl: { type: string }
      responses:
        '200':
          description: Cập nhật thành công
    delete:
      tags: [Children (BE1)]
      summary: Xóa hồ sơ trẻ em
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Xóa thành công

  /api/children/parent/{parentId}:
    get:
      tags: [Children (BE1)]
      summary: Danh sách tất cả hồ sơ trẻ em của phụ huynh
      security:
        - BearerAuth: []
      parameters:
        - name: parentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Danh sách trẻ em

  # =========================================================================
  # BE1 - CHILD PROGRESS
  # =========================================================================
  /api/child-progress:
    post:
      tags: [Child Progress (BE1)]
      summary: Khởi tạo tiến độ học cho trẻ
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childId, courseId]
              properties:
                childId: { type: string, format: uuid }
                courseId: { type: string, format: uuid }
      responses:
        '201':
          description: Đã tạo tiến độ
    put:
      tags: [Child Progress (BE1)]
      summary: Cập nhật tiến độ học của trẻ
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childId, courseId, completedLessons]
              properties:
                childId: { type: string, format: uuid }
                courseId: { type: string, format: uuid }
                completedLessons: { type: integer, example: 5 }
      responses:
        '200':
          description: Cập nhật thành công

  /api/child-progress/{childId}/{courseId}:
    get:
      tags: [Child Progress (BE1)]
      summary: Xem chi tiết tiến độ của trẻ theo khóa học
      security:
        - BearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: courseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Chi tiết tiến độ học tập

  /api/child-progress/child/{childId}:
    get:
      tags: [Child Progress (BE1)]
      summary: Danh sách tất cả khóa học và tiến độ của trẻ
      security:
        - BearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Danh sách tiến độ học

  # =========================================================================
  # BE1 - COURSES CRUD
  # =========================================================================
  /api/courses:
    get:
      tags: [Courses Management (BE1)]
      summary: Danh sách tất cả khóa học trong hệ thống
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách khóa học
    post:
      tags: [Courses Management (BE1)]
      summary: Giáo viên tạo khóa học mới
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, category]
              properties:
                name: { type: string, example: "Học Vẽ Màu Nước Cơ Bản" }
                description: { type: string, example: "Khóa học màu nước cho người mới bắt đầu" }
                price: { type: number, example: 350000 }
                category: { type: string, example: "Màu Nước" }
                coverImageUrl: { type: string, example: "https://example.com/cover.jpg" }
      responses:
        '201':
          description: Tạo khóa học thành công

  /api/courses/{id}:
    get:
      tags: [Courses Management (BE1)]
      summary: Chi tiết khóa học theo ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Chi tiết khóa học
    put:
      tags: [Courses Management (BE1)]
      summary: Cập nhật khóa học
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                price: { type: number }
                category: { type: string }
                coverImageUrl: { type: string }
                status: { type: string, enum: [DRAFT, PENDING, APPROVED, REJECTED] }
      responses:
        '200':
          description: Cập nhật thành công
    delete:
      tags: [Courses Management (BE1)]
      summary: Xóa khóa học
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Xóa thành công

  /api/courses/teacher/{teacherId}:
    get:
      tags: [Courses Management (BE1)]
      summary: Danh sách khóa học của giáo viên
      security:
        - BearerAuth: []
      parameters:
        - name: teacherId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Danh sách khóa học của giáo viên

  # =========================================================================
  # BE1 - CUSTOMIZE REQUESTS & OFFERS
  # =========================================================================
  /api/customize-requests:
    post:
      tags: [Customize Requests (BE1)]
      summary: Phụ huynh gửi yêu cầu khóa học vẽ theo yêu cầu
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, childId]
              properties:
                title: { type: string, example: "Học vẽ tranh sơn dầu cho bé 8 tuổi" }
                description: { type: string, example: "Bé muốn vẽ tĩnh vật và phong cảnh" }
                childId: { type: string, format: uuid }
                budget: { type: number, example: 500000 }
      responses:
        '201':
          description: Đã tạo yêu cầu customize

  /api/customize-requests/{id}:
    get:
      tags: [Customize Requests (BE1)]
      summary: Chi tiết yêu cầu customize
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Chi tiết yêu cầu
    put:
      tags: [Customize Requests (BE1)]
      summary: Cập nhật yêu cầu customize
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                budget: { type: number }
                status: { type: string }
      responses:
        '200':
          description: Cập nhật thành công

  /api/customize-requests/parent/{parentId}:
    get:
      tags: [Customize Requests (BE1)]
      summary: Danh sách yêu cầu customize của phụ huynh
      security:
        - BearerAuth: []
      parameters:
        - name: parentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Danh sách yêu cầu

  /api/customize-requests/teacher/{teacherId}:
    get:
      tags: [Customize Requests (BE1)]
      summary: Danh sách yêu cầu customize gửi tới giáo viên
      security:
        - BearerAuth: []
      parameters:
        - name: teacherId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Danh sách yêu cầu

  /api/customize-requests/status/{status}:
    get:
      tags: [Customize Requests (BE1)]
      summary: Lọc yêu cầu customize theo trạng thái
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Danh sách yêu cầu

  /api/offers:
    post:
      tags: [Offers (BE1)]
      summary: Giáo viên tạo báo giá / đề xuất cho yêu cầu customize
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, price, durationDays]
              properties:
                requestId: { type: string, format: uuid }
                price: { type: number, example: 450000 }
                message: { type: string, example: "Tôi sẽ hoàn thành giáo trình trong 7 ngày" }
                durationDays: { type: integer, example: 7 }
      responses:
        '201':
          description: Báo giá tạo thành công

  /api/offers/{id}:
    get:
      tags: [Offers (BE1)]
      summary: Chi tiết báo giá offer
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Chi tiết báo giá
    delete:
      tags: [Offers (BE1)]
      summary: Hủy báo giá offer
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Đã hủy báo giá

  /api/offers/{id}/status:
    patch:
      tags: [Offers (BE1)]
      summary: Phụ huynh chấp nhận hoặc từ chối báo giá (ACCEPT / REJECT)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACCEPTED, REJECTED] }
      responses:
        '200':
          description: Trạng thái báo giá đã được cập nhật

  /api/offers/request/{requestId}:
    get:
      tags: [Offers (BE1)]
      summary: Danh sách tất cả báo giá cho một yêu cầu customize
      security:
        - BearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Danh sách báo giá

  /api/offers/teacher/{teacherId}:
    get:
      tags: [Offers (BE1)]
      summary: Danh sách báo giá đã gửi của giáo viên
      security:
        - BearerAuth: []
      parameters:
        - name: teacherId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Danh sách báo giá

  # =========================================================================
  # BE1 - ENROLLMENTS & LESSONS
  # =========================================================================
  /api/enrollments:
    post:
      tags: [Enrollments (BE1)]
      summary: Ghi danh khóa học cho trẻ
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childId, courseId]
              properties:
                childId: { type: string, format: uuid }
                courseId: { type: string, format: uuid }
      responses:
        '201':
          description: Ghi danh thành công

  /api/enrollments/{childId}/{courseId}:
    get:
      tags: [Enrollments (BE1)]
