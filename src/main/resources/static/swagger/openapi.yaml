            type: string
        - name: targetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationReviewListResponse'

  /api/v1/moderation/reviews/staff/{staffId}:
    get:
      tags: [Moderation]
      summary: Lịch sử kiểm duyệt do một Nhân viên thực hiện
      security:
        - BearerAuth: []
      parameters:
        - name: staffId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
