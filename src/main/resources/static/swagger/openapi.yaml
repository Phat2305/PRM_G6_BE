      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationReviewRequest'
      responses:
        '200':
          description: Ghi nhận thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'

  /api/v1/moderation/reviews/{targetType}/{targetId}:
    get:
      tags: [Moderation]
      summary: Lịch sử kiểm duyệt theo đối tượng (STF-07)
      security:
        - BearerAuth: []
