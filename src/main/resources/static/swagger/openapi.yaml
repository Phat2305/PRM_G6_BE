            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [FLAGGED, HIDE, UNHIDE]
                reason:
                  type: string
      responses:
        '200':
          description: Xử lý thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyResponse'

  /api/v1/staff/complaints:
    get:
      tags: [Staff]
      summary: Danh sách đơn hàng có khiếu nại (STF-02)
      security:
        - BearerAuth: []
