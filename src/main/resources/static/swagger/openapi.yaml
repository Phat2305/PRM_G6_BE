            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalListResponse'

  /api/v1/admin/finance/withdrawals/{requestId}/approve:
    post:
      tags: [Admin Finance & Config]
      summary: Admin phê duyệt yêu cầu rút tiền (ADM-03, FIN-05)
      security:
        - BearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
