  /api/v1/staff/complaints/{orderId}/conversations:
    get:
      tags: [Staff]
      summary: Xem trao đổi tin nhắn giải quyết khiếu nại (MSG-06)
      description: Bảo mật MSG-06 - Nhân viên CHỈ được xem tin nhắn khi đơn hàng có khiếu nại hợp lệ.
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Đơn hàng không có khiếu nại, cấm truy cập trao đổi

  # =========================================================================
  # 11. ADMIN ANALYTICS
  # =========================================================================
  /api/v1/admin/analytics/finance:
