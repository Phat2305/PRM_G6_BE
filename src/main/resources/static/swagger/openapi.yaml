openapi: 3.0.3
info:
  title: Art Course & Supplies Platform - Backend 2 (BE2) API
  description: |
    Tài liệu đặc tả API chuẩn OpenAPI 3.0 cho phân hệ Backend 2 (BE2).
    Hệ thống bao gồm: Thương mại, Giỏ hàng, Đơn hàng, Thanh toán, Vận chuyển, Tài chính & Sổ cái, Kiểm duyệt & Quản trị.
    
    ### Cơ chế Xác thực:
    - **Header**: `Authorization: Bearer <JWT_ACCESS_TOKEN>`
    - **Thuật toán ký**: HMAC-SHA256 (HS256)
    - **Claims bắt buộc**:
      - `userId`: UUID của người dùng
      - `role`: Vai trò (`PARENT`, `TEACHER`, `STAFF`, `ADMIN`)
      - `type`: Phải là `ACCESS` (Token `REFRESH` bị từ chối)
    
    ### Chuẩn phản hồi chung (ApiResponse):
    Mọi phản hồi JSON đều bọc trong cấu trúc chuẩn:
    ```json
    {
      "success": true,
      "message": "Thông điệp thành công",
      "data": { ... },
      "error": null,
      "timestamp": "2026-10-14T12:00:00Z"
    }
    ```
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Máy chủ Localhost phát triển

tags:
  - name: Shop & Courses
    description: Duyệt danh mục khóa học, xem chi tiết (an toàn không lộ video thô), xem thử bài học và đánh giá (SHOP-01, SHOP-09, SHOP-10)
  - name: Supplies
    description: Xem danh mục dụng cụ vẽ và kiểm tra tồn kho khả dụng (SHOP-02)
  - name: Cart
    description: Quản lý giỏ hàng phụ huynh, kiểm tra xung đột mua trùng khóa học và kiểm tra tồn kho (SHOP-03, SHOP-04, SHOP-08)
  - name: Orders
    description: Tạo đơn hàng tách theo giáo viên, tra cứu và hủy đơn (SHOP-05, SHOP-06, BR-04)
  - name: Payments
    description: Tạo yêu cầu thanh toán (VNPay/MoMo/Mock), xử lý Webhook IPN idempotent và kiểm tra trạng thái (PAY-01, PAY-02, PAY-09, PAY-10)
  - name: Fulfillment
    description: Quản lý vòng đời vận chuyển dụng cụ giáo viên - phụ huynh - nhân viên (FUL-01 đến FUL-08)
  - name: Teacher Finance
    description: Tra cứu số dư sổ cái thời gian thực và yêu cầu rút tiền của Giáo viên (FIN-01, FIN-02, FIN-03, FIN-04)
  - name: Admin Finance & Config
    description: Duyệt/từ chối rút tiền, ghi nhận chi trả thủ công và cấu hình hệ thống (FIN-05, FIN-06, ADM-02, ADM-03)
  - name: Refunds
    description: Yêu cầu, xét duyệt và hoàn tất hoàn tiền theo dòng chi tiết (FIN-07, FIN-08, FIN-09, FIN-10)
  - name: Staff
    description: Kiểm duyệt dụng cụ vi phạm, tiếp nhận khiếu nại và tra cứu trao đổi có kiểm soát (STF-01 đến STF-06, MSG-06)
  - name: Admin Analytics
    description: Thống kê tài chính toàn diện sàn và tra cứu sổ cái kiểm toán (ADM-04, ADM-05, ADM-06)
  - name: Moderation
    description: Ghi nhận và truy vấn lịch sử nhật ký kiểm duyệt đa đối tượng (STF-07)
  - name: Notifications
    description: Hộp thư thông báo người dùng và cập nhật trạng thái đã đọc (NFR-08)

paths:
  # =========================================================================
  # 1. SHOP & COURSES
  # =========================================================================
  /api/v1/shop/courses:
    get:
      tags: [Shop & Courses]
      summary: Danh sách khóa học thương mại đã duyệt (SHOP-01)
      description: Trả về danh sách khóa học có trạng thái APPROVED. Tuyệt đối không chứa video_url.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSummaryListResponse'

  /api/v1/shop/courses/{courseId}:
    get:
      tags: [Shop & Courses]
      summary: Chi tiết khóa học thương mại (SHOP-01)
      description: Trả về thông tin chi tiết và danh sách bài học (chỉ metadata tiêu đề, thứ tự, is_trial; không chứa video_url).
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/shop/courses/lessons/{lessonId}/trial:
    get:
      tags: [Shop & Courses]
      summary: Xem thử video bài học miễn phí (SHOP-10)
      description: Cấp Signed URL xem video bài học dùng thử (thời hạn 1 giờ) thông qua hợp đồng với BE1.
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialLessonResponse'
        '400':
          description: Bài học không cho phép xem thử
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/course-reviews/course/{courseId}:
    get:
      tags: [Shop & Courses]
      summary: Danh sách đánh giá của khóa học (SHOP-09)
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseReviewListResponse'
    post:
      tags: [Shop & Courses]
      summary: Phụ huynh gửi đánh giá khóa học (SHOP-09)
      description: Gửi đánh giá cho khóa học đã hoàn tất, đồng thời kích hoạt sự kiện giải phóng ký quỹ (Escrow Release).
      security:
        - BearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '200':
          description: Đánh giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseReviewResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # =========================================================================
  # 2. SUPPLIES
  # =========================================================================
  /api/v1/supplies:
    get:
      tags: [Supplies]
      summary: Danh mục dụng cụ vẽ (SHOP-02)
      description: Danh sách dụng cụ vẽ đang mở bán kèm tồn kho khả dụng (`stock - reserved`).
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyListResponse'

  /api/v1/supplies/{supplyId}:
    get:
      tags: [Supplies]
      summary: Chi tiết dụng cụ vẽ (SHOP-02)
      parameters:
        - name: supplyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # =========================================================================
  # 3. CART
  # =========================================================================
  /api/v1/cart:
    get:
      tags: [Cart]
      summary: Lấy giỏ hàng của Phụ huynh đăng nhập (SHOP-03)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/cart/items:
    post:
      tags: [Cart]
      summary: Thêm sản phẩm vào giỏ hàng (SHOP-03, SHOP-04)
      description: Thêm khóa học (chọn bé, chặn mua trùng BR-01) hoặc dụng cụ vẽ (kiểm tra tồn khả dụng).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartInput'
      responses:
        '200':
          description: Đã thêm vào giỏ hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemResponse'
        '400':
          description: Bé đã đăng ký khóa học này hoặc hết tồn kho
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/cart/items/{itemId}:
    patch:
      tags: [Cart]
      summary: Cập nhật số lượng mục trong giỏ (SHOP-08)
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuantityInput'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemResponse'
        '400':
          description: Số lượng không hợp lệ hoặc vượt tồn khả dụng
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      tags: [Cart]
      summary: Xóa mục khỏi giỏ hàng
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Đã xóa mục
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # =========================================================================
  # 4. ORDERS
  # =========================================================================
  /api/v1/orders/checkout:
    post:
      tags: [Orders]
      summary: Đặt hàng / Checkout giỏ hàng (SHOP-05, SHOP-06)
      description: Tách đơn tự động theo từng Giáo viên. Khóa bi quan và tăng reserved_quantity cho dụng cụ vẽ. Hạn thanh toán 15 phút.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Tạo đơn hàng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '400':
          description: Thiếu thông tin giao hàng hoặc dụng cụ hết tồn kho
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/orders/my-orders:
    get:
      tags: [Orders]
      summary: Danh sách đơn hàng của Phụ huynh
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'

  /api/v1/orders/teacher-orders:
    get:
      tags: [Orders]
      summary: Danh sách đơn hàng bán được của Giáo viên
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'

  /api/v1/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Xem chi tiết đơn hàng (kèm dòng sản phẩm)
      description: Chỉ chủ sở hữu (Parent/Teacher) hoặc STAFF/ADMIN mới có quyền xem.
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Hủy đơn hàng đang chờ thanh toán
      description: Hoàn trả tồn kho giữ chỗ. Chỉ cho phép khi đơn ở trạng thái PENDING_PAYMENT.
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Đã hủy đơn hàng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          description: Đơn hàng không ở trạng thái chờ thanh toán
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # =========================================================================
  # 5. PAYMENTS
  # =========================================================================
  /api/v1/payments/create:
    post:
      tags: [Payments]
      summary: Khởi tạo yêu cầu thanh toán & sinh URL cổng (PAY-01)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '200':
          description: Tạo URL thanh toán thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponseDto'
        '400':
          description: Đơn hàng không hợp lệ hoặc đã thanh toán

  /api/v1/payments/{paymentId}/status:
    get:
      tags: [Payments]
      summary: Truy vấn chủ động trạng thái thanh toán (PAY-10)
      security:
        - BearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponseDto'

  /api/v1/payments/webhook/{gateway}:
    post:
      tags: [Payments]
      summary: Webhook / IPN xử lý kết quả từ cổng thanh toán (PAY-01, PAY-02, PAY-09)
      description: Xác thực chữ ký số HMAC, kiểm tra khớp số tiền (PAY-02), idempotent an toàn khi gọi lặp.
      parameters:
        - name: gateway
          in: path
          required: true
          schema:
            type: string
            enum: [VNPAY, MOMO, MOCK]
      responses:
        '200':
          description: "Phản hồi chuẩn cho Gateway (e.g. RspCode: 00)"
          content:
            application/json:
              schema:
                type: object
    get:
      tags: [Payments]
      summary: Webhook GET (cho cổng hỗ trợ IPN qua GET như VNPay)
      parameters:
        - name: gateway
          in: path
          required: true
          schema:
            type: string
            enum: [VNPAY, MOMO, MOCK]
      responses:
        '200':
          description: Phản hồi chuẩn cho Gateway
          content:
            application/json:
              schema:
                type: object

  /api/v1/payments/return/{gateway}:
    get:
      tags: [Payments]
      summary: Return URL người dùng chuyển hướng về sau thanh toán
      parameters:
        - name: gateway
          in: path
          required: true
          schema:
            type: string
            enum: [VNPAY, MOMO, MOCK]
      responses:
        '200':
          description: Kết quả xử lý trả về cho frontend
          content:
            application/json:
              schema:
                type: object

  # =========================================================================
  # 6. FULFILLMENT
  # =========================================================================
  /api/v1/fulfillment/teacher/items/{orderDetailId}/confirm-or-reject:
    post:
      tags: [Fulfillment]
      summary: Giáo viên xác nhận hoặc từ chối đơn dụng cụ (FUL-01)
      description: CONFIRM -> Chuyển sang CONFIRMED. REJECT -> Chuyển sang CANCELLED, hoàn kho và tạo Refund PENDING.
      security:
        - BearerAuth: []
      parameters:
        - name: orderDetailId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherConfirmDeliveryRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryStatusResponse'

  /api/v1/fulfillment/teacher/items/{orderDetailId}/shipping:
    post:
      tags: [Fulfillment]
      summary: Giáo viên giao hàng và cập nhật mã vận đơn (FUL-02)
      security:
        - BearerAuth: []
      parameters:
        - name: orderDetailId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryStatusResponse'

  /api/v1/fulfillment/delivered/{orderDetailId}:
    post:
      tags: [Fulfillment]
      summary: Đơn vị vận chuyển / Giáo viên báo hàng đã tới nơi (DELIVERED)
      security:
        - BearerAuth: []
      parameters:
        - name: orderDetailId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryStatusResponse'

  /api/v1/fulfillment/parent/items/{orderDetailId}/confirm-received:
    post:
      tags: [Fulfillment]
      summary: "Phụ huynh xác nhận đã nhận hàng (FUL-03: COMPLETED)"
      description: Chuyển trạng thái sang COMPLETED và kích hoạt kiểm tra giải phóng ký quỹ nếu tất cả dòng hoàn tất.
      security:
        - BearerAuth: []
      parameters:
        - name: orderDetailId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryStatusResponse'

  /api/v1/fulfillment/parent/items/{orderDetailId}/cancel:
    post:
      tags: [Fulfillment]
      summary: Phụ huynh hủy dòng dụng cụ khi Giáo viên chưa xác nhận (FUL-06)
      security:
        - BearerAuth: []
      parameters:
        - name: orderDetailId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Hủy dòng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryStatusResponse'

  /api/v1/fulfillment/staff/items/{orderDetailId}/handle-failure:
    post:
      tags: [Fulfillment]
      summary: Nhân viên xử lý giao hàng thất bại (FUL-07, FUL-08)
      description: Hành động RE_SHIP (giao lại) hoặc REFUND (hoàn tiền).
      security:
        - BearerAuth: []
      parameters:
        - name: orderDetailId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [RE_SHIP, REFUND]
                reason:
                  type: string
      responses:
        '200':
          description: Xử lý thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryStatusResponse'

  # =========================================================================
  # 7. TEACHER FINANCE
  # =========================================================================
  /api/v1/teacher/finance/balance:
    get:
      tags: [TeacherFinance]
      summary: Tra cứu số dư thời gian thực từ sổ cái (FIN-01..03)
      description: Tính toán động từ money_ledger và payments (Held, Available, Pending Withdrawal, Withdrawn).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherBalanceResponse'

  /api/v1/teacher/finance/withdrawals:
    get:
      tags: [TeacherFinance]
      summary: Lịch sử các yêu cầu rút tiền của Giáo viên
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalListResponse'
    post:
      tags: [TeacherFinance]
      summary: Giáo viên gửi yêu cầu rút tiền (FIN-04, BR-15)
      description: Khóa số dư khả dụng (`WITHDRAW_LOCK`). Tối đa 1 yêu cầu đang hoạt động (PENDING/APPROVED).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWithdrawalRequest'
      responses:
        '200':
          description: Gửi yêu cầu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
        '400':
          description: Vượt quá số dư khả dụng hoặc đã có yêu cầu đang chờ xử lý

