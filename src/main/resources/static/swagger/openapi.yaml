                $ref: '#/components/schemas/ModerationReviewListResponse'

  # =========================================================================
  # 13. NOTIFICATIONS
  # =========================================================================
  /api/v1/notifications/my-notifications:
    get:
      tags: [Notifications]
      summary: Lấy danh sách thông báo của người dùng đăng nhập (NFR-08)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'

  /api/v1/notifications/{id}/read:
    patch:
      tags: [Notifications]
