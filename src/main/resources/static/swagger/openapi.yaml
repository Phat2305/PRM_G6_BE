            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'

  /api/v1/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Đánh dấu tất cả thông báo của người dùng đã đọc
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Đã đánh dấu tất cả đọc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'

# =============================================================================
# COMPONENTS & SCHEMAS
# =============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Nhập JWT Bearer token HS256 được cấp từ BE1.
        Phải chứa claim `userId`, `role` (PARENT/TEACHER/STAFF/ADMIN), `type=ACCESS`.

  responses:
    UnauthorizedError:
      description: Chưa xác thực hoặc Token không hợp lệ / hết hạn / sai vai trò
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Không có quyền truy cập tài nguyên (Sai vai trò hoặc không phải chủ sở hữu)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Error Response
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Không tìm thấy tài nguyên
        error:
          type: object
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: Không tìm thấy đơn hàng
        timestamp:
          type: string
          format: date-time

    EmptyApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thao tác thành công
        data:
          type: object
          nullable: true
        timestamp:
          type: string
          format: date-time

    CountResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: integer
          example: 5
        timestamp:
          type: string
          format: date-time

    # DTOs & Models
    CourseSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        thumbnailUrl:
          type: string
        price:
          type: number
          example: 500000
        ratingAvg:
          type: number
          example: 4.8
        totalStudents:
          type: integer
          example: 120

    CourseSummaryListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/CourseSummaryDto'

    LessonSummaryDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        orderNumber: { type: integer }
        durationMinutes: { type: integer }
        isTrial: { type: boolean }

    CourseDetailDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        thumbnailUrl: { type: string }
        price: { type: number }
        ratingAvg: { type: number }
        totalStudents: { type: integer }
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonSummaryDto'

    CourseDetailResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/CourseDetailDto'

    TrialLessonDto:
      type: object
      properties:
        lessonId: { type: string, format: uuid }
        title: { type: string }
        videoSignedUrl:
          type: string
          example: "https://storage.artcourse.com/videos/trial_123.mp4?signature=xyz"
        expiresAt:
          type: string
          format: date-time

    TrialLessonResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/TrialLessonDto'

    CreateReviewRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: "Khóa học rất bổ ích cho bé!"

    CourseReview:
      type: object
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        parentId: { type: string, format: uuid }
        rating: { type: integer }
        comment: { type: string }
        createdAt: { type: string, format: date-time }

    CourseReviewResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          $ref: '#/components/schemas/CourseReview'

    CourseReviewListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/CourseReview'

    Supply:
      type: object
      properties:
        id: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        price: { type: number, example: 120000 }
        stockQuantity: { type: integer, example: 50 }
        reservedQuantity: { type: integer, example: 5 }
        soldQuantity: { type: integer, example: 20 }
        availableStock: { type: integer, example: 45 }
        status: { type: string, enum: [ACTIVE, HIDDEN, FLAGGED, OUT_OF_STOCK] }

    SupplyResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/Supply'

    SupplyListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Supply'

    AddToCartInput:
      type: object
      required: [itemType, quantity]
      properties:
        itemType:
          type: string
          enum: [COURSE, SUPPLY]
        courseId:
          type: string
          format: uuid
        supplyId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
          description: Bắt buộc khi itemType là COURSE
        quantity:
          type: integer
          minimum: 1
          example: 1

    UpdateQuantityInput:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 2

    CartItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        cartId: { type: string, format: uuid }
        productType: { type: string, enum: [COURSE, SUPPLY] }
        courseId: { type: string, format: uuid, nullable: true }
        supplyId: { type: string, format: uuid, nullable: true }
        childId: { type: string, format: uuid, nullable: true }
        quantity: { type: integer }
        unitPrice: { type: number }

    CartItemResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          $ref: '#/components/schemas/CartItem'

    CartItemListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'

    CheckoutItem:
      type: object
      required: [itemType, quantity]
      properties:
        itemType: { type: string, enum: [COURSE, SUPPLY] }
        courseId: { type: string, format: uuid }
        supplyId: { type: string, format: uuid }
        childId: { type: string, format: uuid }
        quantity: { type: integer, example: 1 }

    CheckoutRequest:
      type: object
      properties:
        useCart:
          type: boolean
          default: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutItem'
        recipientName:
          type: string
          example: "Nguyen Van A"
        recipientPhone:
          type: string
          example: "0901234567"
        shippingAddress:
          type: string
          example: "123 Đường Nguyễn Trãi, Quận 1, TP.HCM"

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }
        orderCode: { type: string, example: "ORD-20261014-ABCD" }
        subTotal: { type: number, example: 620000 }
        shippingFee: { type: number, example: 30000 }
        totalAmount: { type: number, example: 650000 }
        status:
          type: string
          enum: [PENDING_PAYMENT, PAID, CANCELLED, EXPIRED, REFUNDED]
        recipientName: { type: string }
        recipientPhone: { type: string }
        shippingAddress: { type: string }
        expiredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    OrderDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        productType: { type: string, enum: [COURSE, SUPPLY] }
        courseId: { type: string, format: uuid, nullable: true }
        supplyId: { type: string, format: uuid, nullable: true }
        childId: { type: string, format: uuid, nullable: true }
        productName: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        subTotal: { type: number }
        commissionRate: { type: number, example: 0.2 }
        commissionAmount: { type: number, example: 100000 }
        teacherEarnings: { type: number, example: 400000 }
        deliveryStatus:
          type: string
          enum: [PENDING, CONFIRMED, SHIPPING, DELIVERED, COMPLETED, CANCELLED, DELIVERY_FAILED, REFUNDED]

    OrderListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'

    OrderDetailResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            order:
              $ref: '#/components/schemas/Order'
            details:
              type: array
              items:
                $ref: '#/components/schemas/OrderDetail'

    CreatePaymentRequest:
      type: object
      required: [orderId, gateway, returnUrl]
      properties:
        orderId: { type: string, format: uuid }
        gateway: { type: string, enum: [VNPAY, MOMO, MOCK] }
        returnUrl: { type: string, example: "https://frontend.artcourse.com/payment/callback" }

    PaymentResponseDto:
      type: object
      properties:
        paymentId: { type: string, format: uuid }
        paymentUrl: { type: string, example: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html?..." }
        gateway: { type: string }
        amount: { type: number }

    PaymentStatusResponseDto:
      type: object
      properties:
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED, REFUNDED] }
        escrowStatus: { type: string, enum: [NONE, HELD, RELEASED, REFUNDED] }
        amount: { type: number }

    TeacherConfirmDeliveryRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [CONFIRM, REJECT] }
        reason: { type: string, nullable: true }

    ShippingUpdateRequest:
      type: object
      required: [shippingProvider, trackingCode]
      properties:
        shippingProvider: { type: string, example: "Giao Hàng Nhanh (GHN)" }
        trackingCode: { type: string, example: "GHN123456789" }

    DeliveryStatusResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            orderDetailId: { type: string, format: uuid }
            deliveryStatus: { type: string }
            shippingProvider: { type: string }
            trackingCode: { type: string }

    TeacherBalanceDto:
      type: object
      properties:
        teacherId: { type: string, format: uuid }
        heldBalance: { type: number, example: 500000, description: "Tiền đang ký quỹ (đơn chưa xong)" }
        availableBalance: { type: number, example: 1200000, description: "Tiền khả dụng có thể rút" }
        pendingWithdrawal: { type: number, example: 300000, description: "Tiền đang chờ duyệt rút" }
        withdrawnAmount: { type: number, example: 4000000, description: "Tổng tiền đã rút về tài khoản" }

    TeacherBalanceResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/TeacherBalanceDto'

    CreateWithdrawalRequest:
      type: object
      required: [amount, bankInfo]
      properties:
        amount:
          type: number
          minimum: 50000
          example: 500000
        bankInfo:
          type: string
          example: "Techcombank - 190312345678 - NGUYEN VAN TEACHER"

    RejectWithdrawalRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          example: "Thông tin tài khoản ngân hàng không trùng khớp"

    MarkPaidRequest:
      type: object
      required: [transactionCode]
      properties:
        transactionCode:
          type: string
          example: "TXN-VIB-987654321"
        proofImageUrl:
          type: string
          example: "https://storage.artcourse.com/proofs/payout_123.jpg"

    WithdrawalResponseDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }
        amount: { type: number }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, PAID] }
        bankInfo: { type: string }
        transactionCode: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    WithdrawalResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          $ref: '#/components/schemas/WithdrawalResponseDto'

    WithdrawalListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/WithdrawalResponseDto'

    CreateRefundRequest:
      type: object
      required: [orderId, orderDetailId, reason, bankInfo]
      properties:
        orderId: { type: string, format: uuid }
        orderDetailId: { type: string, format: uuid }
        reason: { type: string, example: "Bé không phù hợp với khóa học này" }
        bankInfo: { type: string, example: "Vietcombank - 0123456789 - PHAM THI PARENT" }

    CompleteRefundRequest:
      type: object
      required: [transactionCode]
      properties:
        transactionCode: { type: string, example: "REFUND-TXN-112233" }
        proofImageUrl: { type: string, example: "https://storage.artcourse.com/proofs/refund_01.png" }

    RefundResponseDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderDetailId: { type: string, format: uuid }
        amount: { type: number }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, COMPLETED] }
        reason: { type: string }
        bankInfo: { type: string }
        transactionCode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    RefundResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          $ref: '#/components/schemas/RefundResponseDto'

    SystemConfig:
      type: object
      properties:
        key: { type: string, example: "default_shipping_fee" }
        value: { type: string, example: "30000" }
        description: { type: string }
        updatedAt: { type: string, format: date-time }

    SystemConfigResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          $ref: '#/components/schemas/SystemConfig'

    SystemConfigListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/SystemConfig'

    AdminAnalyticsDto:
      type: object
      properties:
        totalRevenue: { type: number, example: 50000000 }
        heldBalance: { type: number, example: 5000000 }
        availableBalance: { type: number, example: 15000000 }
        pendingWithdrawal: { type: number, example: 2000000 }
        totalWithdrawn: { type: number, example: 25000000 }
        totalRefunded: { type: number, example: 1000000 }
        platformCommission: { type: number, example: 8000000 }

    AdminAnalyticsResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/AdminAnalyticsDto'

    MoneyLedger:
      type: object
      properties:
        id: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }
        orderId: { type: string, format: uuid, nullable: true }
        paymentId: { type: string, format: uuid, nullable: true }
        entryType:
          type: string
          enum: [HOLD, RELEASE, WITHDRAW_LOCK, WITHDRAW_UNLOCK, PAYOUT, REFUND]
        amount: { type: number }
        description: { type: string }
        createdAt: { type: string, format: date-time }

    MoneyLedgerListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/MoneyLedger'

    ModerationReviewRequest:
      type: object
      required: [targetType, targetId, decision]
      properties:
        targetType:
          type: string
          enum: [TEACHER_PROFILE, COURSE, SUPPLY, CUSTOMIZE_REQUEST, REFUND]
        targetId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [APPROVED, REJECTED, FLAGGED, RESOLVED]
        reason:
          type: string

    ModerationReview:
      type: object
      properties:
        id: { type: string, format: uuid }
        staffId: { type: string, format: uuid }
        targetType: { type: string }
        targetId: { type: string, format: uuid }
        decision: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    ModerationReviewListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModerationReview'

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        title: { type: string }
        message: { type: string }
        type: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    NotificationListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
