<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kết quả thanh toán</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f1f6ff; color: #1f2d4d; }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 22px; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Đang kiểm tra...</h1>
  <p>Bạn có thể đóng trang này và quay lại ứng dụng.</p>
</main>
<script>
  // PayOS gắn ?status=PAID|CANCELLED&cancel=true|false vào returnUrl/cancelUrl. Kết quả chính thức do webhook xác nhận.
  const q = new URLSearchParams(location.search);
  const paid = q.get('status') === 'PAID' && q.get('cancel') !== 'true';
  document.getElementById('title').textContent = paid
    ? 'Thanh toán thành công'
    : 'Thanh toán chưa hoàn tất';
</script>
</body>
</html>
