<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kết quả thanh toán</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f1f6ff; color: #1f2d4d; }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 22px; }
    a.back { display: inline-block; margin-top: 8px; padding: 12px 24px; border-radius: 10px; background: #2f7bf0; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Đang kiểm tra...</h1>
  <p>Bạn có thể đóng trang này và quay lại ứng dụng.</p>
  <a id="back" class="back" href="#">Quay lại ứng dụng</a>
</main>
<script>
  // PayOS gắn ?status=PAID|CANCELLED&cancel=true|false vào returnUrl/cancelUrl. Kết quả chính thức do webhook xác nhận.
  const q = new URLSearchParams(location.search);
  const paid = q.get('status') === 'PAID' && q.get('cancel') !== 'true';
  const cancelled = q.get('cancel') === 'true' || q.get('status') === 'CANCELLED';
  document.getElementById('title').textContent = paid
    ? 'Thanh toán thành công'
    : cancelled ? 'Bạn đã hủy thanh toán' : 'Thanh toán chưa hoàn tất';
  // Mở lại app (intent-filter scheme "elearning" trong AndroidManifest); app đang chờ sẽ tự hỏi lại trạng thái thanh toán.
  // Trình duyệt không mở được thì người dùng bấm nút hoặc tự chuyển về app.
  const deepLink = 'elearning://payment-result?status=' + (paid ? 'PAID' : 'CANCELLED');
  document.getElementById('back').href = deepLink;
  setTimeout(() => { location.href = deepLink; }, 600);
</script>
</body>
</html>
