<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kết quả thanh toán</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f1f6ff; color: #1f2d4d; }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 22px; }
    a.back, button.back { display: inline-block; margin-top: 8px; padding: 12px 24px; border-radius: 10px; background: #2f7bf0; color: #fff; font-weight: 700; text-decoration: none; border: none; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Đang kiểm tra...</h1>
  <p>Bạn có thể đóng trang này và quay lại ứng dụng.</p>
  <button id="back" class="back" onclick="closeAndReturn()">Quay lại ứng dụng</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const paid = q.get('status') === 'PAID' && q.get('cancel') !== 'true';
  const cancelled = q.get('cancel') === 'true' || q.get('status') === 'CANCELLED';
  document.getElementById('title').textContent = paid
    ? 'Thanh toán thành công'
    : cancelled ? 'Bạn đã hủy thanh toán' : 'Thanh toán chưa hoàn tất';

  const deepLink = 'elearning://payment-result?status=' + (paid ? 'PAID' : 'CANCELLED');

  function closeAndReturn() {
    try {
      if (window.opener) window.opener.focus();
      window.close();
    } catch (e) {}
    location.href = deepLink;
  }

  // Tự động đóng tab ngay lập tức
  closeAndReturn();
  setTimeout(closeAndReturn, 400);
</script>
</body>
</html>
