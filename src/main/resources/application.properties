spring.application.name=ART_COURSE

# =====================================================================
# BẢO MẬT & CƠ SỞ DỮ LIỆU
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ART_COURSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway mặc định TẮT (chỉ bật khi chạy profile dev với DATABASE_URL_DEV)
spring.flyway.enabled=false

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# JWT Configuration (hỗ trợ cả BE1 và BE2 keys)
app.jwt.expiration-ms=86400000
jwt.secret=${JWT_SECRET:FALL2026_ART_COURSE_PRM391_GROUP_6}
jwt.expiration=86400000

# Server
server.port=${PORT:8080}

# Video Upload & HLS Processing (BE1)
app.video.upload-dir=uploads/videos
app.video.max-file-size=157286400
app.video.hls-dir=uploads/hls
app.video.ffmpeg-path=ffmpeg

# Multipart configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Cloudflare R2
app.video.r2.endpoint=https://54764958a246d87c1e15a4613972dd9d.r2.cloudflarestorage.com
app.video.r2.bucket=art-course-videos
app.video.r2.access-key=${R2_ACCESS_KEY}
app.video.r2.secret-key=${R2_SECRET_KEY}
app.video.r2.region=auto

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
# SendGrid (HTTPS). Có SENDGRID_API_KEY thì dùng SendGrid thay SMTP; SENDGRID_FROM phải là Single Sender / domain đã xác minh trên SendGrid
app.mail.sendgrid.api-key=${SENDGRID_API_KEY:}
app.mail.sendgrid.from=${SENDGRID_FROM:}
# Chạy sau ngrok/proxy: lấy scheme+host từ X-Forwarded-* để Swagger gọi đúng https
server.forward-headers-strategy=framework
# Gửi mail (quên mật khẩu). Điền MAIL_* trong .env; Gmail dùng App Password
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.username=${MAIL_USERNAME:}
spring.rabbitmq.host=localhost
spring.rabbitmq.password=guest
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest