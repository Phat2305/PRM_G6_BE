spring.application.name=ART_COURSE

# =====================================================================
# BẢO MẬT & CƠ SỞ DỮ LIỆU MẶC ĐỊNH (NGHIÊM CẤM TRỎ SUPABASE)
# =====================================================================
# Flyway mặc định TẮT (chỉ bật khi chạy profile dev với DATABASE_URL_DEV)
spring.flyway.enabled=false

# Hibernate ddl-auto = none để không tự động sửa cấu trúc DB
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Bắt buộc cấu hình biến môi trường JWT_SECRET; không dùng secret mặc định)
app.jwt.expiration-ms=86400000

# Server
server.port=${PORT:8080}
