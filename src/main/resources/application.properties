spring.application.name=ART_COURSE
spring.datasource.url=jdbc:postgresql://localhost:5432/ART_COURSE
spring.datasource.username=postgres
spring.datasource.password=12345
jwt.secret=${JWT_SECRET:FALL2026_ART_COURSE_PRM391_GROUP_6}
jwt.expiration=86400000
spring.datasource.driver-class-name=org.postgresql.Driver
# Folder lưu video gốc
app.video.upload-dir=uploads/videos
app.video.max-file-size=104857600
# Folder chứa video HLS sau khi xử lý
app.video.hls-dir=uploads/hls

# Đường dẫn tới FFmpeg
app.video.ffmpeg-path=ffmpeg

# Giới hạn dung lượng file: 500 MB
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


